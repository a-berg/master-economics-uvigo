asignaturas:
  - nombre: "Pensamiento Económico e Instituciones"
    referencias:
      basica:
        - "Acemoglu, D. (2009). Introduction to modern economic growth, Princeton University Press."
        - "Del Río, F. (2014). Os piares institucionais da prosperidade, European Liberal Forum Asbl."
        - "Parente, S. L., & Prescott, E. C. (2002). Barriers to riches. MIT press."
        - "Weil, D. N. (2006). Crecimiento Económico. Pearson Educación."
      complementaria:
        - "North, D. C. (1990). Institutions, Institutional Change, and Economic Performance. New York: Cambridge University Press."
        - "North, D. C. (1991). Institutions. Journal of economic perspectives, 5(1), 97-112."
        - "North, D. C. (2003). The role of institutions in economic development. Discussion Paper Series Nº 2003.2. United Nations Economic Commission for Europe."
    docentes:
      - "Manuel Fernández Grela"
    toc: |
      Tema 1) Desarrollo económico: las cuestiones.
      a. Diferencias de renta per cápita entre países.
      b. Renta y Bienestar.
      c. Crecimiento económico y diferencias de renta.
      d. Los orígenes de las diferencias modernas en la renta per cápita y el crecimiento económico moderno.
      e. Convergencia condicional
      f. Correlaciones del crecimiento económico
      g. De las correlaciones a las causas fundamentales
      Tema 2) Determinantes próximos: el modelo de Solow
      a. La acumulación de capital
      b. La tecnología y el crecimiento.
      c. La convergencia.
      d. El capital humano.
      e. Contabilidad del crecimiento
      Tema 3) Determinantes fundamentales: las instituciones.
      a. Causas próximas versus causas fundamentales.
      b. Economías de escala, población, tecnología y crecimiento económico.
      c. Las cuatro causas fundamentales.
      d. Los efectos de las instituciones sobre el crecimiento económico.
      e. ¿Qué son las instituciones y cuáles importan?
      f. Economía política de las instituciones: una primera aproximación
      g. Comprendiendo la evolución institucional endógena.
      Tema 4) La influencia de las instituciones en la eficiencia.
      a. Diferencia de eficiencia: algunos ejemplos.
      i. La planificación central en la Unión Soviética
      ii. La industria textil en 1910.
      iii. Diferencias internacionales de productividad por industrias.
      iv. La minería subterránea en los Estados Unidos.
      b. Tipos de ineficiencias.
      i. Actividades improductivas.
      ii. Recursos inutilizados.
      iii. Mala asignación sectorial de los factores productivos.
      iv. Bloqueo de la tecnología.
      c. Apertura y eficiencia
      i. ¿Por qué Eurasia y no América o Australia?
      ii. La globalización: hechos y causas.
      iii. Oposición a la apertura: la antiglobalización
      iv. Apertura, renta per cápita y crecimiento económico
      1. Japón.
      2. Irlanda: el tigre celta.
      3. La Gran Depresión.
      v. La apertura y la ventaja comparativa
      vi. Apertura y progreso tecnológio.
      vii. Apertura y competencia
      Tema 5) Las instituciones formales y el Estado.
      a. El papel del Estado en la economía: argumentos a favor y en contra de la intervención.
      b. El Estado y las instituciones que importan.
      i. La buena gobernanza: el imperio de la ley y otros atributos.
      ii. Impuestos, eficiencia y dimensiones del Estado.
      iii. La planificación y otras políticas industriales.
      iv. La otra senda
      v. La planificación no siempre es un fracaso.
      c. Por qué los gobiernos adoptan políticas perjudiciales para el crecimiento
      i. Algún otro objetivo.
      ii. Corrupción y cleptocracia.
      iii. El instinto de supervivencia.
      iv. La regulación pública: ¿Mano benefactora o mano depredadora?
      d. Por qué los países pobres tienen malos gobiernos.
      i. La renta y la gobernanza: ida y vuelta.
      ii. Democracia y crecimiento económico
      Tema 6) Las instituciones informales: la cultura.
      a. Influencia de la cultura en el crecimiento económico.
      i. Apertura a la nuevas ideas.
      ii. El esfuerzo.
      iii. Ahorrar para el futuro.
      iv. La confianza.
      v. El capital social
      vi. La capacidad social.
      vii. Problemas con las explicaciones culturales.
      b. ¿Qué determina la cultura?
      i. El clima y los recursos naturales.
      ii. Homogeneidad cultural y capital social.
      iii. Densidad de población y capacidad social
      c. El cambio cultural.
      i. Crecimiento económico y cambio cultural.
      ii. La política del gobierno y el cambio cultural.
      Tema 7) Otros determinantes fundamentales.*(opcional)
      a. La geografía
      i. La localización, el comercio y el crecimiento.
      ii. Concentración geográfica y efectos difusión.
      iii. Influencia de la geografía en el tipo de gobierno.
      b. El clima
      i. El clima y la productividad agrícola.
      ii. Clima y enfermedades.
      iii. Clima y esfuerzo humano.
      c. Los recursos naturales.
      i. La relación entre los recursos naturales y el crecimiento
      ii. Explicaciónes de la maldición de los recursos naturales.
      iii. Los recursos y los comienzos del desarrollo industrial: el caso del carbón.
      d. La desigualdad
      i. La desigualdad de la renta: los hechos.
      ii. Causas de la desigualdad de la renta.
      iii. Explicaciones del aumento reciente en la desigualdad de la renta.
      iv. Influencia de la desigualdad de la renta en el crecimiento económico.
      v. Más allá de la distribución de la renta: la movilidad económica.
      Tema 8) Algo de historia: por qué algunos lo lograron y otros no.
      a. Por qué Gran Bretaña antes que Europa Continental.
      b. Por qué no fue primero China.
      c. Por qué los Estados Unidos y Suiza lo hicieron tan bien.
      d. Por qué Japón experimentó su milagro de desarrollo.
      Tema 9) Reformas institucionales y desarrollo
      a. Competencia, libre comercio y privatización.

  - nombre: "Análisis de decisiones económicas y mercados"
    docentes:
      - Laura Varela Candamio (UDC)
      - Miguel Pérez-Nievas Montiel (USC)
      - Eduardo L.Giménez (UVigo)
    referencias:
      parte_i:
        - "Frank, Robert (2001) Microeconomía y Conducta. McGraw-Hill."
        - "Varian, H (2010). Microeconomía intermedia. Antoni Bosch."
        - "Pindyck, RS., Rubinfeld, DL (2013) Microeconomía. Prentice Hall."
      parte_ii:
        - "Stiglitz, Joseph (2000) Economía del Sector público. Antoni Bosch."
        - "Antelo, M (2015) Economía de la información. McGraw-Hill."
        - "Goolsbee, A., Levitt, S., Syverson, C (2015) Microeconomía. Reverté."
        - "Gravelle, H., Rees, R (2004) Microeconomía. Pearson Prentice Hall."
    toc: |
      Parte I. Herramientas básicas
      1. Que estudian os Economistas?
      2. Como piensan os economistas?
      La regla de decisión racional
      3. ¿Cómo se ponen de acuerdo compradores e vendedores en un mercado?
      Equilibrio de un Mercado y Bienestar
      a. Excedente del Consumidor
      b. Excedente del Productor
      4. ¿Qué se intercambia en un mercado?
      El concepto de mercancía
      5. ¿Cómo decide un Consumidor?
      La decisión do consumidor,
      a. La curva de demanda individual
      b. La curva de demanda mercado.
      6. ¿Cómo decide una Empresa/un Empresario?
      I. Tecnología y costes
      7. ¿Cómo decide una Empresa/un Empresario?
      II. La decisión da empresa en competencia perfecta,
      a. La curva de oferta individual
      b. La curva de oferta de mercado.
      8. ¿Cómo se ponen de acuerdo compradores y vendedores en todos los mercados?
      Equilibrio General de Mercados y Bien-estar
      a. Eficiencia en sentido de Pareto
      b. Primer Teorema del Bienestar
      9. ¿Cómo se ponen de acuerdo consumidores y empresas en todos los mercados?
      Equilibrio General de Mercados con Producción
      a. Frontera de Posibilidades de Producción
      Parte II. Fallos de Mercado
      1. Externalidades, Bienes Públicos y Poder de Mercado
      2. Asimetrías de información
      3. Políticas Públicas: Intervención Estatal y Gobierno 

  - nombre: "Métodos cuantitativos"
    docentes:
      - José Benito Pérez Lopez
      - Maria Luisa Chas Amil
      - Manuel Alberto Gómez Suárez
      - Xesús Pereira López
      - Francisco Javier García Cutrín
      - Xesús Pereira López
    referencias:
      general:
        - "Adams, R. (2009). Cálculo. Pearson."
        - "Barro, R., Sala-i-Martin, X. (2004). Economic Growth. (Anexo matemático). MIT Press."
        - "Cerdá, E. (2011). Optimización Dinámica. Garceta."
        - "Dalgaard, P. (2002). Introductory Statistics with R. Springer."
        - "García Pérez, A. (2009). Estadística Aplicada con R. UNED."
        - "Kamien, M., Schwartz, N. (2012). Dynamic Optimization, Second Edition: The Calculus of Variations and Optimal Control in Economics and Management. Dover Publications, Inc."
        - "Ruiz-Maya Pérez, L., Martín Pliego, F.J. (2005). Fundamentos de Inferencia Estadística. Ed. Thomson."
        - "Sydsaeter, K., Hammond, P. Seierstad, A., Strom, A. (2008). Further Mathematics for Economic Analysis. Prentice-Hall."
        - "Wasserman, L. (2003). All of Statistics. A Concise Course in Statistical Inference. Springer."
    toc: |
      1. Convexidade e optimización
      1.1. Autovalores, autovectores, diagonalización de matrices.
      1.2. Conxuntos e funcións convexas.
      1.3. Convexidade e diferenciabilidade.
      1.4. Optimización con restriccións de igualdade.
      1.5. Optimización con restriccións de desigualdade.

      2. Ecuacións diferenciais
      2.1. Concepto de ecuación diferencial.
      2.2. Ecuacións diferenciais de orde 1.
      2.3. Sistemas de ecuacións diferenciais.
      2.4. Equilibrio, estabilidade, diagrama de fases.

      3. Optimización dinámica
      3.1. Presentación do problema.
      3.2. Condicións de primera orde.
      3.3. Condición de transversalidade.
      3.4. Condición suficiente.
      3.5. Horizonte infinito.

      4. Análise de datos con R
      4.1. Introdución a R.
      4.2. Preparación dos datos.
      4.3. Análise exploratoria de datos.


      5. Variables aleatorias e estimación de parámetros
      5.1. Tipos de variables aleatorias, caracterización, exemplos notables.
      5.2. Simulación de variables aleatorias.
      5.3. Estimación de parámetros.
      5.4. Propiedades dos estimadores.


      6. Inferencia estatística: intervalos de confianza e contrastes de hipóteses
      6.1. Métodos de obtención de intervalos de confianza (método pivotal, métodos bootstrap).
      6.2. Elementos dun contraste de hipóteses.
      6.3. Contrastes clásicos no contexto paramétrico.
      6.4. Contrastes non paramétricos.
      6.5. Contrastes de bondade de axuste. 
